openapi: 3.0.3
info:
  title: StrideBR Core API
  version: v1
  description: API pública v1 usada pelo StrideBR App. Somente as rotas deste documento estão implementadas.
servers:
  - url: https://stridebr.com.br/api/v1
paths:
  /health:
    get:
      responses:
        '200': { description: API disponível }
  /meta:
    get:
      responses:
        '200':
          description: Metadados públicos da API e identificador opcional do build de deploy.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [api_version, server_time, build]
                    properties:
                      api_version: { type: string, example: v1 }
                      server_time: { type: string, format: date-time }
                      build: { type: string, maxLength: 80, nullable: true, description: Valor de STRIDEBR_BUILD quando configurado no deploy. }
  /auth/login:
    post:
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200': { description: Sessão criada }
        '401': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
  /auth/refresh:
    post:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties:
                refresh_token: { type: string }
      responses:
        '200': { description: Tokens rotacionados }
        '401': { $ref: '#/components/responses/Error' }
  /auth/logout:
    post:
      security: [{ bearerAuth: [] }]
      responses:
        '204': { description: Sessão revogada }
        '401': { $ref: '#/components/responses/Error' }
  /me:
    get:
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Usuário autenticado.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SelfProfileResponse' }
        '401': { $ref: '#/components/responses/Error' }
    patch:
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProfilePatchRequest' }
      responses:
        '200':
          description: Perfil atualizado.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SelfProfileResponse' }
        '401': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /me/privacy:
    get:
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Preferências de privacidade do usuário }
        '401': { $ref: '#/components/responses/Error' }
    patch:
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PrivacyPatchRequest' }
      responses:
        '200': { description: Preferências atualizadas }
        '401': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /sports:
    get:
      security: [{ bearerAuth: [] }]
      description: Catálogo completo de modalidades ativas registráveis. Inclui globais e custom do próprio usuário; não depende de Activities no período.
      parameters:
        - { name: q, in: query, schema: { type: string }, description: Busca por nome ou slug. }
        - { name: family, in: query, schema: { type: string }, description: Filtra pela família canônica. }
      responses:
        '200':
          description: Catálogo ordenado para seleção em Activity manual.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SportCatalogResponse' }
        '401': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /people/search:
    get:
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: q, in: query, required: true, schema: { type: string } }
        - { name: type, in: query, schema: { type: string, enum: [all, friend, trainer], default: all } }
      responses:
        '200':
          description: Pessoas ativas e descobríveis; no máximo 20 resultados e sem dados privados.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PeopleSearchResponse' }
        '401': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /people/{id}:
    get:
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Perfil público seguro e estado de relação com o usuário atual.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PersonDetailResponse' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /people/friends:
    get:
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Amizades aceitas e solicitações incoming/outgoing.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FriendsResponse' }
        '401': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /people/friendships:
    post:
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user_id]
              properties:
                user_id: { type: string }
      responses:
        '201': { description: Solicitação criada. }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /people/friendships/{id}/accept:
    post:
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Solicitação recebida aceita. }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /people/friendships/{id}/reject:
    post:
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Solicitação recebida recusada e removida. }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /people/friendships/{id}:
    delete:
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Cancela outgoing pending ou remove amizade aceita; replay de ID inexistente é seguro para o participante. }
        '401': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /people/coaching:
    get:
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Treinadores, atletas e vínculos pending incoming/outgoing.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CoachingResponse' }
        '401': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
    post:
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user_id, role_for_me]
              properties:
                user_id: { type: string }
                role_for_me: { type: string, enum: [trainer, athlete] }
      responses:
        '201': { description: Convite/vínculo pending criado reutilizando o domínio Web. }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /people/coaching/{id}/accept:
    post:
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Vínculo pending recebido aceito. }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /people/coaching/{id}/reject:
    post:
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Vínculo pending recebido recusado, preservando histórico. }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /people/coaching/{id}/permissions:
    patch:
      security: [{ bearerAuth: [] }]
      description: Somente o atleta do vínculo aceito controla as permissões concedidas ao treinador.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CoachingPermissionsPatch' }
      responses:
        '200': { description: Permissões atualizadas. }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /people/coaching/{id}:
    delete:
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Cancela convite enviado ou encerra vínculo aceito, preservando histórico de coaching. }
        '401': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /equipment:
    get:
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Equipamentos do próprio usuário }
        '401': { $ref: '#/components/responses/Error' }
    post:
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EquipmentMutationRequest' }
      responses:
        '201': { description: Equipamento criado }
        '401': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /equipment/{id}:
    patch:
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EquipmentMutationRequest' }
      responses:
        '200': { description: Equipamento atualizado }
        '404': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
    delete:
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Equipamento arquivado; replay é seguro }
        '404': { $ref: '#/components/responses/Error' }
  /institutional/context:
    get:
      security: [{ bearerAuth: [] }]
      description: Contexto institucional athlete-safe do próprio usuário. A rota não existe quando STRIDEBR_TEAMS_ENABLED=false.
      responses:
        '200':
          description: Contexto institucional; my_teams pode ser vazio para usuário sem vínculo.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/InstitutionalAthleteContext' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /institutional/teams/{team_ref}/roster:
    parameters:
      - { name: team_ref, in: path, required: true, description: Referência opaca da Team; o cliente deve URL-encodar e reenviar sem interpretar., schema: { type: string } }
      - { name: season, in: query, required: true, description: Referência opaca da Season., schema: { type: string } }
    get:
      security: [{ bearerAuth: [] }]
      description: Roster athlete-safe somente de uma Team/Season à qual o usuário autenticado pertence.
      responses:
        '200':
          description: Athletes e staff em allowlist mínima.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/InstitutionalRoster' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /institutional/competitions:
    get:
      security: [{ bearerAuth: [] }]
      description: Competitions institucionais relevantes ao próprio atleta. Não inclui participantes de terceiros.
      responses:
        '200':
          description: Lista pequena, sem paginação artificial.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/InstitutionalCompetitionSummary' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /institutional/competitions/{competition_ref}:
    parameters:
      - { name: competition_ref, in: path, required: true, description: Referência opaca da Competition; o cliente deve URL-encodar e reenviar sem interpretar., schema: { type: string } }
    get:
      security: [{ bearerAuth: [] }]
      description: Detalhe athlete-safe com somente a Competition, organização, período, delegação e entries/results do próprio atleta.
      responses:
        '200':
          description: Competition institucional visível ao usuário autenticado.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/InstitutionalCompetitionDetail' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /workout-schedules:
    get:
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Cronogramas pessoais disponíveis para recorrência.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkoutScheduleContainerListResponse' }
        '401': { $ref: '#/components/responses/Error' }
    post:
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WorkoutScheduleContainerRequest' }
      responses:
        '201':
          description: Cronograma pessoal criado.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/WorkoutScheduleContainer' }
        '401': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /workout-templates:
    get:
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: page, in: query, schema: { type: integer, minimum: 1 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100 } }
        - { name: q, in: query, schema: { type: string } }
        - { name: sport, in: query, schema: { type: string } }
      responses:
        '200':
          description: Biblioteca pessoal paginada.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkoutTemplateListResponse' }
        '401': { $ref: '#/components/responses/Error' }
    post:
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WorkoutTemplateWriteRequest' }
      responses:
        '201':
          description: Template criado.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/WorkoutTemplateDetail' }
        '401': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /workout-templates/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Template completo ownership-scoped.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/WorkoutTemplateDetail' }
        '404': { $ref: '#/components/responses/Error' }
    patch:
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WorkoutTemplateWriteRequest' }
      responses:
        '200':
          description: Template atualizado atomicamente.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/WorkoutTemplateDetail' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
    delete:
      security: [{ bearerAuth: [] }]
      responses:
        '204': { description: Template arquivado. }
        '409': { $ref: '#/components/responses/Error' }
  /exercises:
    get:
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: q, in: query, schema: { type: string } }
        - { name: page, in: query, schema: { type: integer, minimum: 1 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100 } }
        - { name: sport, in: query, schema: { type: string } }
        - { name: category, in: query, schema: { type: string } }
        - { name: muscle, in: query, schema: { type: string } }
      responses:
        '200':
          description: Catálogo do sistema mais exercícios pessoais visíveis ao usuário.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExerciseListResponse' }
        '401': { $ref: '#/components/responses/Error' }
    post:
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ExerciseWriteRequest' }
      responses:
        '201':
          description: Exercício personalizado criado.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/ExerciseCatalogItem' }
        '422': { $ref: '#/components/responses/Error' }
  /exercises/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Exercício acessível pelo usuário.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/ExerciseCatalogItem' }
        '404': { $ref: '#/components/responses/Error' }
    patch:
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ExerciseWriteRequest' }
      responses:
        '200':
          description: Exercício pessoal atualizado.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/ExerciseCatalogItem' }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
    delete:
      security: [{ bearerAuth: [] }]
      responses:
        '204': { description: Exercício pessoal arquivado. }
        '403': { $ref: '#/components/responses/Error' }
  /exercises/{id}/history:
    get:
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 20, default: 5 } }
      responses:
        '200':
          description: Execuções reais recentes e melhor carga do exercício.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExerciseHistoryResponse' }
        '404': { $ref: '#/components/responses/Error' }
  /workouts/schedule:
    get:
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: from, in: query, required: true, schema: { type: string, format: date } }
        - { name: to, in: query, required: true, schema: { type: string, format: date } }
      responses:
        '200':
          description: Ocorrências pessoais no intervalo inclusivo, sem árvore completa de exercícios.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkoutScheduleResponse' }
        '401': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /workouts:
    post:
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: Idempotency-Key, in: header, required: false, schema: { type: string, minLength: 8, maxLength: 128 }, description: Opcional; retries com o mesmo payload retornam o mesmo workout. }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WorkoutCreateRequest' }
      responses:
        '200': { description: Replay idempotente de workout previamente criado. }
        '201':
          description: Treino pessoal planejado.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/WorkoutDetail' }
        '401': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /workouts/templates:
    get:
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: page, in: query, schema: { type: integer, minimum: 1 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100 } }
        - { name: q, in: query, schema: { type: string } }
      responses:
        '200':
          description: Biblioteca pessoal de treinos reutilizáveis.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkoutTemplateListResponse' }
        '401': { $ref: '#/components/responses/Error' }
  /workouts/templates/{id}:
    get:
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Template completo ownership-scoped.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/WorkoutTemplateDetail' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /workouts/{id}:
    get:
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, description: ID opaco retornado pelo calendário., schema: { type: string } }
      responses:
        '200':
          description: Detalhe do treino/ocorrência ownership-scoped.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/WorkoutDetail' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
    patch:
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WorkoutUpdateRequest' }
      responses:
        '200': { description: Treino pessoal alterado }
        '401': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
    delete:
      security: [{ bearerAuth: [] }]
      parameters:
