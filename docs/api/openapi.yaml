        label: { type: string, maxLength: 60, nullable: true }
        min: { type: number, format: double, nullable: true }
        max: { type: number, format: double, nullable: true }
    ZoneRange:
      allOf:
        - { $ref: '#/components/schemas/ZoneRangeInput' }
        - type: object
          properties:
            id: { type: string }
            order: { type: integer, minimum: 1 }
    ZoneProfileWriteRequest:
      type: object
      required: [profile_type, name, zones]
      properties:
        profile_type: { type: string, enum: [heart_rate, pace] }
        name: { type: string, minLength: 1, maxLength: 80 }
        sport: { type: string, nullable: true, description: ID ou slug; null cria perfil global. }
        is_default: { type: boolean, default: false }
        zones:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/ZoneRangeInput' }
    ZoneProfilePatchRequest:
      type: object
      properties:
        profile_type: { type: string, enum: [heart_rate, pace] }
        name: { type: string, minLength: 1, maxLength: 80 }
        sport: { type: string, nullable: true }
        is_default: { type: boolean }
        zones:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/ZoneRangeInput' }
    ZoneProfile:
      type: object
      required: [id, profile_type, name, unit, is_default, zones]
      properties:
        id: { type: string }
        profile_type: { type: string, enum: [heart_rate, pace] }
        name: { type: string }
        unit: { type: string, enum: [bpm, s_per_km] }
        is_default: { type: boolean }
        sport:
          allOf: [{ $ref: '#/components/schemas/SportRef' }]
          nullable: true
        zones: { type: array, items: { $ref: '#/components/schemas/ZoneRange' } }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    ZoneDistributionItem:
      type: object
      required: [code, time_s, distance_m, percentage]
      properties:
        code: { type: string }
        label: { type: string, nullable: true }
        time_s: { type: number, format: double, minimum: 0 }
        distance_m: { type: number, format: double, minimum: 0 }
        percentage: { type: number, format: double, minimum: 0, maximum: 100 }
    ZoneDistribution:
      type: object
      required: [profile, observed_time_s, observed_distance_m, zones]
      properties:
        profile:
          type: object
          properties:
            id: { type: string }
            name: { type: string }
            unit: { type: string }
        observed_time_s: { type: number, format: double }
        observed_distance_m: { type: number, format: double }
        zones: { type: array, items: { $ref: '#/components/schemas/ZoneDistributionItem' } }
    ActivityPacingAnalysis:
      type: object
      required: [behavior, unit, pattern, pattern_even_threshold_percent]
      properties:
        behavior: { type: string, enum: [pace, speed, pace_100m] }
        unit: { type: string, enum: [s_per_km, km_h, s_per_100m] }
        average: { type: number, format: double, nullable: true }
        moving_average: { type: number, format: double, nullable: true }
        median: { type: number, format: double, nullable: true }
        p10: { type: number, format: double, nullable: true }
        p50: { type: number, format: double, nullable: true }
        p90: { type: number, format: double, nullable: true }
        standard_deviation: { type: number, format: double, nullable: true }
        median_absolute_deviation: { type: number, format: double, nullable: true }
        variability_percent: { type: number, format: double, nullable: true }
        first_half: { type: number, format: double, nullable: true }
        second_half: { type: number, format: double, nullable: true }
        difference: { type: number, format: double, nullable: true }
        difference_percent: { type: number, format: double, nullable: true }
        pattern: { type: string, enum: [negative_split, even, positive_split, insufficient_data] }
        pattern_even_threshold_percent: { type: number, format: double, example: 2 }
        start: { type: object, additionalProperties: { type: number, nullable: true } }
        middle: { type: object, additionalProperties: { type: number, nullable: true } }
        finish: { type: object, additionalProperties: true }
    ActivityHeartRateAnalysis:
      type: object
      properties:
        average_bpm: { type: number, format: double, nullable: true }
        max_bpm: { type: number, format: double }
        min_bpm: { type: number, format: double }
        coverage_percent: { type: number, format: double, minimum: 0, maximum: 100 }
        observed_time_s: { type: number, format: double, minimum: 0 }
        first_half_bpm: { type: number, format: double, nullable: true }
        second_half_bpm: { type: number, format: double, nullable: true }
        trend_bpm: { type: number, format: double, nullable: true }
        zones:
          allOf: [{ $ref: '#/components/schemas/ZoneDistribution' }]
          nullable: true
        decoupling:
          type: object
          nullable: true
          properties:
            first_half_efficiency_mps_per_bpm: { type: number, format: double }
            second_half_efficiency_mps_per_bpm: { type: number, format: double }
            decoupling_percent: { type: number, format: double }
            method: { type: string, enum: [speed_mps_per_bpm_halves_by_distance] }
            requirements: { type: object, additionalProperties: { type: number } }
    ActivityElevationAnalysis:
      type: object
      properties:
        min_m: { type: number, format: double }
        max_m: { type: number, format: double }
        gain_m: { type: number, format: double }
        loss_m: { type: number, format: double }
        grade:
          type: object
          nullable: true
          properties:
            average_percent: { type: number, format: double, nullable: true }
            p10_percent: { type: number, format: double, nullable: true }
            p50_percent: { type: number, format: double, nullable: true }
            p90_percent: { type: number, format: double, nullable: true }
            window_min_distance_m: { type: number, format: double }
            target_window_distance_m: { type: number, format: double }
        smoothing: { type: object, additionalProperties: { type: number } }
    ActivityCadenceAnalysis:
      type: object
      properties:
        unit: { type: string, enum: [spm, rpm] }
        average: { type: number, format: double, nullable: true }
        max: { type: number, format: double }
        coverage_percent: { type: number, format: double }
        first_half: { type: number, format: double, nullable: true }
        second_half: { type: number, format: double, nullable: true }
    ActivityBestEffort:
      type: object
      properties:
        label: { type: string, enum: [400m, 500m, 1km, 1mile, 5km] }
        distance_m: { type: number, format: double }
        duration_s: { type: number, format: double }
        start_distance_m: { type: number, format: double }
        end_distance_m: { type: number, format: double }
        pace_s_per_km: { type: number, format: double }
        speed_kmh: { type: number, format: double }
    ActivityAnalysisFinding:
      type: object
      required: [code, analysis_version, formula, thresholds, supporting_values]
      properties:
        code: { type: string, enum: [negative_split, even, positive_split, strong_finish, pace_variability_high, heart_rate_drift_detected] }
        analysis_version: { type: integer, minimum: 1 }
        formula: { type: string }
        thresholds: { type: object, additionalProperties: true }
        supporting_values: { type: object, additionalProperties: true }
    ActivityAnalysis:
      type: object
      required: [activity_id, analysis_version, data_quality, rolling, best_efforts, findings, cache, units]
      properties:
        activity_id: { type: string }
        analysis_version: { type: integer, enum: [1] }
        sport: { $ref: '#/components/schemas/SportRef' }
        data_quality:
          type: object
          properties:
            sample_count: { type: integer, minimum: 0 }
            available_streams: { type: array, items: { $ref: '#/components/schemas/ActivityStreamType' } }
            has_streams: { type: boolean }
        pacing:
          allOf: [{ $ref: '#/components/schemas/ActivityPacingAnalysis' }]
          nullable: true
        rolling: { type: array, items: { type: object, additionalProperties: true } }
        best_efforts: { type: array, items: { $ref: '#/components/schemas/ActivityBestEffort' } }
        heart_rate:
          allOf: [{ $ref: '#/components/schemas/ActivityHeartRateAnalysis' }]
          nullable: true
        pace_zones:
          allOf: [{ $ref: '#/components/schemas/ZoneDistribution' }]
          nullable: true
        elevation:
          allOf: [{ $ref: '#/components/schemas/ActivityElevationAnalysis' }]
          nullable: true
        cadence:
          allOf: [{ $ref: '#/components/schemas/ActivityCadenceAnalysis' }]
          nullable: true
        power:
          type: object
          nullable: true
          properties:
            average_w: { type: number, format: double, nullable: true }
            max_w: { type: number, format: double }
            coverage_percent: { type: number, format: double }
        findings: { type: array, items: { $ref: '#/components/schemas/ActivityAnalysisFinding' } }
        cache:
          type: object
          properties:
            hit: { type: boolean }
            computed_at: { type: string, format: date-time }
        units: { type: object, additionalProperties: { type: string } }
    ActivityAnalysisResponse:
      type: object
      properties:
        data: { $ref: '#/components/schemas/ActivityAnalysis' }
    PacerGuidanceRules:
      type: object
      properties:
        rules_version: { type: integer, enum: [1, 2], default: 2 }
        goal_mode: { type: string, enum: [target_time, best_effort], default: target_time }
        clock_mode: { type: string, enum: [auto, elapsed, moving], default: auto }
        persistence_s: { type: integer, minimum: 1, maximum: 120, default: 15 }
        hysteresis_s_per_km: { type: number, format: double, minimum: 0, maximum: 120, default: 3 }
        cooldown_s: { type: integer, minimum: 0, maximum: 300, default: 20 }
        heart_rate_persistence_s: { type: integer, minimum: 1, maximum: 120, default: 15 }
        final_push:
          type: object
          properties:
            enabled: { type: boolean, default: false }
            remaining_distance_m: { type: number, format: double, exclusiveMinimum: 0, maximum: 10000, default: 1000 }
            max_behind_s: { type: number, format: double, minimum: -3600, maximum: 3600, default: 0 }
        final_phase:
          type: object
          properties:
            enabled: { type: boolean, default: true }
            percent: { type: number, minimum: 1, maximum: 30, default: 10 }
            min_distance_m: { type: number, minimum: 50, maximum: 5000, default: 150 }
            max_distance_m: { type: number, minimum: 100, maximum: 10000, default: 1000 }
            kick_distance_m: { type: number, minimum: 50, maximum: 500, default: 150 }
        milestone_distance_m: { type: number, minimum: 100, maximum: 10000, default: 1000 }
        max_opportunity_improvement_percent: { type: number, minimum: 1, maximum: 20, default: 7 }
    PacerSegmentInput:
      type: object
      required: [start_distance_m, end_distance_m, target_pace_s_per_km]
      properties:
        basis: { type: string, enum: [distance], default: distance }
        start_distance_m: { type: number, format: double, minimum: 0 }
        end_distance_m: { type: number, format: double, exclusiveMinimum: 0 }
        target_pace_s_per_km: { type: number, format: double, minimum: 60, maximum: 3600 }
        tolerance_s_per_km: { type: number, format: double, minimum: 0, maximum: 600 }
        heart_rate_floor_bpm: { type: integer, minimum: 20, maximum: 260, nullable: true }
        heart_rate_ceiling_bpm: { type: integer, minimum: 20, maximum: 260, nullable: true }
        instruction_metadata: { type: object, additionalProperties: true }
    PacerSegment:
      allOf:
        - { $ref: '#/components/schemas/PacerSegmentInput' }
        - type: object
          properties:
            id: { type: string, nullable: true }
            order: { type: integer, minimum: 1 }
            start_time_s: { type: number, nullable: true }
            end_time_s: { type: number, nullable: true }
    PacerGenerateRequest:
      type: object
      required: [sport, target_distance_m, target_time_s, strategy]
      properties:
        sport: { type: string, description: Modalidade com metrica_derivada=pace_km. }
        target_distance_m: { type: number, format: double, exclusiveMinimum: 0, maximum: 500000 }
        target_time_s: { type: number, format: double, exclusiveMinimum: 0, maximum: 604800 }
        goal_mode: { type: string, enum: [target_time, best_effort] }
        clock_mode: { type: string, enum: [auto, elapsed, moving] }
        strategy: { type: string, enum: [even, negative_split, positive_split, custom] }
        tolerance_s_per_km: { type: number, format: double, minimum: 0, maximum: 600, default: 10 }
        guidance_rules: { $ref: '#/components/schemas/PacerGuidanceRules' }
        constraints:
          type: object
          properties:
            progression_percent: { type: number, exclusiveMinimum: 0, maximum: 30 }
            segment_distance_m: { type: number, minimum: 200 }
            heart_rate_floor_bpm: { type: integer, minimum: 20, maximum: 260 }
            heart_rate_ceiling_bpm: { type: integer, minimum: 20, maximum: 260 }
        segments:
          type: array
          minItems: 1
          maxItems: 200
          items: { $ref: '#/components/schemas/PacerSegmentInput' }
    PacerPlanWriteRequest:
      allOf:
        - { $ref: '#/components/schemas/PacerGenerateRequest' }
        - type: object
          properties:
            name: { type: string, maxLength: 120 }
            status: { type: string, enum: [active, archived] }
    PacerPlanPatchRequest:
      type: object
      properties:
        name: { type: string, maxLength: 120 }
        sport: { type: string }
        strategy: { type: string, enum: [even, negative_split, positive_split, custom] }
        target_distance_m: { type: number, format: double, exclusiveMinimum: 0, maximum: 500000 }
        target_time_s: { type: number, format: double, exclusiveMinimum: 0, maximum: 604800 }
        goal_mode: { type: string, enum: [target_time, best_effort] }
        clock_mode: { type: string, enum: [auto, elapsed, moving] }
        tolerance_s_per_km: { type: number, format: double, minimum: 0, maximum: 600 }
        guidance_rules: { $ref: '#/components/schemas/PacerGuidanceRules' }
        status: { type: string, enum: [active, archived] }
        constraints:
          type: object
          additionalProperties: true
        segments:
          type: array
          minItems: 1
          maxItems: 200
          items: { $ref: '#/components/schemas/PacerSegmentInput' }
    PacerBlueprint:
      type: object
      required: [sport, strategy, target_distance_m, target_time_s, target_average_pace_s_per_km, default_tolerance_s_per_km, terrain_adjustment_mode, guidance_rules, segments, calculated_target_time_s]
      properties:
        sport: { $ref: '#/components/schemas/SportRef' }
        strategy: { type: string, enum: [even, negative_split, positive_split, custom] }
        target_distance_m: { type: number, format: double }
        target_time_s: { type: number, format: double }
        goal_mode: { type: string, enum: [target_time, best_effort] }
        clock_mode: { type: string, enum: [auto, elapsed, moving] }
        target_average_pace_s_per_km: { type: number, format: double }
        default_tolerance_s_per_km: { type: number, format: double }
        terrain_adjustment_mode: { type: string, enum: [none] }
        guidance_rules: { $ref: '#/components/schemas/PacerGuidanceRules' }
        segments: { type: array, items: { $ref: '#/components/schemas/PacerSegment' } }
        calculated_target_time_s: { type: number, format: double }
    PacerPlan:
      allOf:
        - { $ref: '#/components/schemas/PacerBlueprint' }
        - type: object
          required: [id, name, status, version, created_at, updated_at]
          properties:
            id: { type: string }
            name: { type: string }
            status: { type: string, enum: [active, archived] }
            version: { type: integer, minimum: 1 }
            created_at: { type: string, format: date-time }
            updated_at: { type: string, format: date-time }
    PacerGuidanceState:
      type: object
      properties:
        segment_order: { type: integer, minimum: 1, nullable: true }
        candidate_code: { type: string, nullable: true }
        candidate_since_s: { type: number, format: double, nullable: true }
        hr_above_since_s: { type: number, format: double, nullable: true }
        last_guidance_code: { type: string, nullable: true }
        last_guidance_at_s: { type: number, format: double, nullable: true }
    PacerEvaluationInput:
      type: object
      required: [distance_m, elapsed_s, moving_time_s]
      properties:
        distance_m: { type: number, format: double, minimum: 0 }
        elapsed_s: { type: number, format: double, minimum: 0 }
        moving_time_s: { type: number, format: double, minimum: 0 }
        recent_pace_s_per_km: { type: number, format: double, nullable: true }
        average_pace_s_per_km: { type: number, format: double, nullable: true }
        heart_rate_bpm: { type: integer, minimum: 20, maximum: 260, nullable: true }
        gps_quality: { type: string, enum: [good, degraded, poor], default: good }
        paused: { type: boolean, default: false }
        guidance_state: { $ref: '#/components/schemas/PacerGuidanceState' }
    PacerEvaluation:
      type: object
      required: [code, ahead_behind_s, target_elapsed_s, projected_finish, heart_rate_constraint, next_state]
      properties:
        code: { type: string, enum: [paused, gps_unreliable, hr_limit, segment_change, speed_up, slow_down, recovering, on_target, final_phase_available, final_push, final_kick, milestone, finished] }
        phase: { type: string, enum: [running, paused, final_phase, finished] }
        severity: { type: string, enum: [info, correction, encouragement] }
        progress: { type: object, additionalProperties: true }
        timing: { type: object, additionalProperties: true }
        gps: { type: object, properties: { quality: { type: string, enum: [good, degraded, poor] } } }
        opportunity: { type: object, additionalProperties: true }
        message: { type: object, additionalProperties: true }
        segment:
          type: object
          nullable: true
          properties:
            order: { type: integer }
            start_distance_m: { type: number }
            end_distance_m: { type: number }
            progress_percent: { type: number, minimum: 0, maximum: 100 }
        target:
          type: object
          nullable: true
          properties:
            pace_s_per_km: { type: number }
            tolerance_s_per_km: { type: number }
            lower_pace_s_per_km: { type: number }
            upper_pace_s_per_km: { type: number }
            heart_rate_floor_bpm: { type: integer, nullable: true }
            heart_rate_ceiling_bpm: { type: integer, nullable: true }
        ahead_behind_s: { type: number, format: double, description: Positivo = atrasado; negativo = adiantado. }
        target_elapsed_s: { type: number, format: double }
        remaining_distance_m: { type: number, format: double, nullable: true }
        projected_finish:
          type: object
          properties:
            at_current_average_s: { type: number, format: double, nullable: true }
            if_plan_followed_s: { type: number, format: double, nullable: true }
        heart_rate_constraint:
          type: object
          properties:
            available: { type: boolean }
            status: { type: string, enum: [not_configured, unavailable, within_constraint, above_ceiling, finished] }
            current_bpm: { type: integer, nullable: true }
            ceiling_bpm: { type: integer, nullable: true }
        rules: { $ref: '#/components/schemas/PacerGuidanceRules' }
        next_state: { $ref: '#/components/schemas/PacerGuidanceState' }
  responses:
    Error:
      description: Erro JSON padronizado
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: object
                properties:
                  code: { type: string }
                  message: { type: string }
                  fields: { type: object }
