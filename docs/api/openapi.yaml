              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/PacerBlueprint' }
        '401': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /pacer-plans:
    get:
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [active, archived] } }
      responses:
        '200':
          description: Pacer Plans do owner.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/PacerPlan' } }
        '401': { $ref: '#/components/responses/Error' }
    post:
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PacerPlanWriteRequest' }
      responses:
        '201':
          description: Plano persistido.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/PacerPlan' }
        '401': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /pacer-plans/{id}:
    get:
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Pacer Plan completo do owner.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/PacerPlan' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
    patch:
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PacerPlanPatchRequest' }
      responses:
        '200':
          description: Pacer Plan atualizado; version incrementada.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/PacerPlan' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
    delete:
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '204': { description: Pacer Plan arquivado. }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /pacer-plans/{id}/evaluate:
    post:
      security: [{ bearerAuth: [] }]
      description: Evaluator de referência para testes/simulação. O runtime durante a atividade deve ser reproduzido localmente pelo Mobile e não chamado continuamente.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PacerEvaluationInput' }
      responses:
        '200':
          description: Guidance determinístico e next_state da state machine.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/PacerEvaluation' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }

components:
  parameters:
    ProgressFrom:
      name: from
      in: query
      description: Data civil inicial inclusiva em America/Sao_Paulo. Deve ser enviada com to. Sem ambos, o default é 28 dias.
      schema: { type: string, format: date }
    ProgressTo:
      name: to
      in: query
      description: Data civil final inclusiva em America/Sao_Paulo. Intervalo máximo de 1827 dias.
      schema: { type: string, format: date }
    ProgressSport:
      name: sport
      in: query
      description: ID ou slug canônico de modalidade ativa disponível ao usuário. Ausente significa todas as modalidades.
      schema: { type: string }
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer }
  schemas:
    ProgressRange:
      type: object
      required: [from, to, days, timezone]
      properties:
        from: { type: string, format: date }
        to: { type: string, format: date }
        days: { type: integer, minimum: 1, maximum: 1827 }
        timezone: { type: string, enum: [America/Sao_Paulo] }
    ProgressSport:
      type: object
      nullable: true
      required: [id, slug, name, family, route_capable, derived_metric, behavior]
      properties:
        id: { type: string }
        slug: { type: string }
        name: { type: string }
        family: { type: string }
        route_capable: { type: boolean }
        derived_metric: { type: string, enum: [nenhuma, pace_km, pace_100m, velocidade_kmh, split_500m] }
        behavior: { type: string, enum: [pace, speed, pace_100m, distance_time], nullable: true, description: Derivado de metrica_derivada no Core; o cliente não deve inferir pelo slug. }
    ProgressComparison:
      type: object
      nullable: true
      required: [current, previous, delta, change_percent]
      properties:
        current: { type: number, nullable: true }
        previous: { type: number, nullable: true }
        delta: { type: number, nullable: true }
        change_percent: { type: number, nullable: true, description: Null quando previous é zero ou quando algum lado é indisponível. }
    ProgressUnits:
      type: object
      required: [duration, distance, elevation_gain, load, strength_volume, pace, pace_100m, speed, perceived_effort, training_load, count]
      properties:
        duration: { type: string, enum: [s] }
        distance: { type: string, enum: [m] }
        elevation_gain: { type: string, enum: [m] }
        load: { type: string, enum: [kg] }
        strength_volume: { type: string, enum: [kg] }
        pace: { type: string, enum: [s_per_km] }
        pace_100m: { type: string, enum: [s_per_100m] }
        speed: { type: string, enum: [km_h] }
        perceived_effort: { type: string, enum: [rpe_1_10] }
        training_load: { type: string, enum: [session_rpe_au] }
        count: { type: string, enum: [count] }
    ProgressPreviousRange:
      type: object
      required: [from, to, timezone]
      properties:
        from: { type: string, format: date }
        to: { type: string, format: date }
        timezone: { type: string, enum: [America/Sao_Paulo] }
    ProgressEffortSummary:
      type: object
      nullable: true
      required: [count, average, min, max]
      properties:
        count: { type: integer, minimum: 1 }
        average: { type: number, minimum: 1, maximum: 10 }
        min: { type: number, minimum: 1, maximum: 10 }
        max: { type: number, minimum: 1, maximum: 10 }
    ProgressConsistency:
      type: object
      required: [active_days, weeks_with_activity, weeks_in_range, planned_completion_rate]
      properties:
        active_days: { type: integer, minimum: 0 }
        weeks_with_activity: { type: integer, minimum: 0 }
        weeks_in_range: { type: integer, minimum: 1 }
        planned_completion_rate: { type: number, minimum: 0, maximum: 1, nullable: true }
    ProgressOverviewSummary:
      type: object
      required: [activities_count, active_days, total_duration_s, total_distance_m, elevation_gain_m, total_training_load, perceived_effort, total_workouts, planned_workouts, completed_workouts, consistency]
      properties:
        activities_count: { type: integer, minimum: 0 }
        active_days: { type: integer, minimum: 0 }
        total_duration_s: { type: number, minimum: 0, nullable: true }
        total_distance_m: { type: number, minimum: 0, nullable: true }
        elevation_gain_m: { type: number, minimum: 0, nullable: true }
        total_training_load: { type: number, minimum: 0, nullable: true, description: 'duration_minutes × perceived_effort, mesma semântica do Sport Hub Web.' }
        perceived_effort: { $ref: '#/components/schemas/ProgressEffortSummary' }
        total_workouts: { type: integer, minimum: 0 }
        planned_workouts: { type: integer, minimum: 0 }
        completed_workouts: { type: integer, minimum: 0 }
        consistency: { $ref: '#/components/schemas/ProgressConsistency' }
    ProgressOverviewData:
      type: object
      required: [range, previous_range, sport, summary, adherence, previous_period, units]
      properties:
        range: { $ref: '#/components/schemas/ProgressRange' }
        previous_range: { $ref: '#/components/schemas/ProgressPreviousRange' }
        sport: { $ref: '#/components/schemas/ProgressSport' }
        summary: { $ref: '#/components/schemas/ProgressOverviewSummary' }
        adherence: { $ref: '#/components/schemas/ProgressAdherenceData' }
        previous_period:
          type: object
          required: [activities_count, active_days, total_duration_s, total_distance_m, elevation_gain_m, total_training_load, perceived_effort_average]
          properties:
            activities_count: { $ref: '#/components/schemas/ProgressComparison' }
            active_days: { $ref: '#/components/schemas/ProgressComparison' }
            total_duration_s: { $ref: '#/components/schemas/ProgressComparison' }
            total_distance_m: { $ref: '#/components/schemas/ProgressComparison' }
            elevation_gain_m: { $ref: '#/components/schemas/ProgressComparison' }
            total_training_load: { $ref: '#/components/schemas/ProgressComparison' }
            perceived_effort_average: { $ref: '#/components/schemas/ProgressComparison' }
        units: { $ref: '#/components/schemas/ProgressUnits' }
    ProgressOverviewResponse:
      type: object
      required: [data]
      properties:
        data: { $ref: '#/components/schemas/ProgressOverviewData' }
    ProgressTimeseriesPoint:
      type: object
      required: [start, end, value]
      properties:
        start: { type: string, format: date }
        end: { type: string, format: date }
        value: { type: number, nullable: true, description: Zero representa ausência real no bucket quando a métrica é somável/contável; null representa dado indisponível. }
    ProgressTimeseriesData:
      type: object
      required: [range, sport, metric, bucket, unit, data]
      properties:
        range: { $ref: '#/components/schemas/ProgressRange' }
        sport: { $ref: '#/components/schemas/ProgressSport' }
        metric: { type: string, enum: [activities, duration, distance, elevation_gain, training_load, perceived_effort, strength_volume] }
        bucket: { type: string, enum: [day, week, month] }
        unit: { type: string, enum: [count, s, m, session_rpe_au, rpe_1_10, kg] }
        data:
          type: array
          items: { $ref: '#/components/schemas/ProgressTimeseriesPoint' }
    ProgressTimeseriesResponse:
      type: object
      required: [data]
      properties:
        data: { $ref: '#/components/schemas/ProgressTimeseriesData' }
    ProgressSportDistributionItem:
      type: object
      required: [sport, activities_count, duration_s, distance_m, elevation_gain_m, activities_percentage]
      properties:
        sport: { $ref: '#/components/schemas/ProgressSport' }
        activities_count: { type: integer, minimum: 0 }
        duration_s: { type: number, minimum: 0, nullable: true }
        distance_m: { type: number, minimum: 0, nullable: true }
        elevation_gain_m: { type: number, minimum: 0, nullable: true }
        activities_percentage: { type: number, minimum: 0, maximum: 100 }
    ProgressSportsData:
      type: object
      required: [range, data, units]
      properties:
        range: { $ref: '#/components/schemas/ProgressRange' }
        data:
          type: array
          items: { $ref: '#/components/schemas/ProgressSportDistributionItem' }
        units: { $ref: '#/components/schemas/ProgressUnits' }
    ProgressSportsResponse:
      type: object
      required: [data]
      properties:
        data: { $ref: '#/components/schemas/ProgressSportsData' }
    ProgressCalendarDay:
      type: object
      required: [date, activities_count, duration_s, distance_m, training_load]
      properties:
        date: { type: string, format: date }
        activities_count: { type: integer, minimum: 0 }
        duration_s: { type: number, minimum: 0, nullable: true }
        distance_m: { type: number, minimum: 0, nullable: true }
        training_load: { type: number, minimum: 0, nullable: true }
    ProgressCalendarData:
      type: object
      required: [range, sport, data, units]
      properties:
        range: { $ref: '#/components/schemas/ProgressRange' }
        sport: { $ref: '#/components/schemas/ProgressSport' }
        data:
          type: array
          items: { $ref: '#/components/schemas/ProgressCalendarDay' }
        units: { $ref: '#/components/schemas/ProgressUnits' }
    ProgressCalendarResponse:
      type: object
      required: [data]
      properties:
        data: { $ref: '#/components/schemas/ProgressCalendarData' }
    ProgressCardioSummary:
      type: object
      required: [activities_count, active_days, duration_s, distance_m, elevation_gain_m, longest_distance_m, longest_duration_s, average_pace_s_per_km, average_pace_s_per_100m, average_speed_kmh, paired_activities_count]
      properties:
        activities_count: { type: integer, minimum: 0 }
        active_days: { type: integer, minimum: 0 }
        duration_s: { type: number, minimum: 0, nullable: true }
        distance_m: { type: number, minimum: 0, nullable: true }
        elevation_gain_m: { type: number, minimum: 0, nullable: true }
        longest_distance_m: { type: number, minimum: 0, nullable: true }
        longest_duration_s: { type: number, minimum: 0, nullable: true }
        average_pace_s_per_km: { type: number, minimum: 0, nullable: true }
        average_pace_s_per_100m: { type: number, minimum: 0, nullable: true }
        average_speed_kmh: { type: number, minimum: 0, nullable: true }
        paired_activities_count: { type: integer, minimum: 0 }
    ProgressCardioSeriesPoint:
      type: object
      required: [start, end, distance_m, duration_s, average_pace_s_per_km, average_pace_s_per_100m, average_speed_kmh]
      properties:
        start: { type: string, format: date }
        end: { type: string, format: date }
        distance_m: { type: number, minimum: 0, nullable: true }
        duration_s: { type: number, minimum: 0, nullable: true }
        average_pace_s_per_km: { type: number, minimum: 0, nullable: true }
        average_pace_s_per_100m: { type: number, minimum: 0, nullable: true }
        average_speed_kmh: { type: number, minimum: 0, nullable: true }
    ProgressCardioTrends:
      type: object
      required: [distance, duration, activities, performance]
      properties:
        distance: { $ref: '#/components/schemas/ProgressComparison' }
        duration: { $ref: '#/components/schemas/ProgressComparison' }
        activities: { $ref: '#/components/schemas/ProgressComparison' }
        performance: { $ref: '#/components/schemas/ProgressComparison' }
    ProgressCardioData:
      type: object
      required: [range, sport, behavior, current, previous, trends, bucket, timeseries, units]
      properties:
        range: { $ref: '#/components/schemas/ProgressRange' }
        sport: { $ref: '#/components/schemas/ProgressSport' }
        behavior: { type: string, enum: [pace, speed, pace_100m, distance_time] }
        current: { $ref: '#/components/schemas/ProgressCardioSummary' }
        previous: { $ref: '#/components/schemas/ProgressCardioSummary' }
        trends: { $ref: '#/components/schemas/ProgressCardioTrends' }
        bucket: { type: string, enum: [day, week, month] }
        timeseries:
          type: array
          items: { $ref: '#/components/schemas/ProgressCardioSeriesPoint' }
        units: { $ref: '#/components/schemas/ProgressUnits' }
    ProgressCardioResponse:
      type: object
      required: [data]
      properties:
        data: { $ref: '#/components/schemas/ProgressCardioData' }
    ProgressStrengthExerciseDistribution:
      type: object
      required: [exercise_id, name, sets_count, reps, volume_load_kg]
      properties:
        exercise_id: { type: string, nullable: true }
        name: { type: string }
        sets_count: { type: integer, minimum: 0 }
        reps: { type: integer, minimum: 0 }
        volume_load_kg: { type: number, minimum: 0, nullable: true }
    ProgressStrengthMuscleDistribution:
      type: object
      required: [name, completed_sets]
      properties:
        name: { type: string }
        completed_sets: { type: integer, minimum: 0 }
    ProgressStrengthData:
      type: object
      required: [range, sport, sessions, active_days, total_sets, completed_sets, total_reps, volume_load_kg, exercises_count, duration_s, distribution_by_exercise, distribution_by_primary_muscle, units]
      properties:
        range: { $ref: '#/components/schemas/ProgressRange' }
        sport: { $ref: '#/components/schemas/ProgressSport' }
        sessions: { type: integer, minimum: 0 }
        active_days: { type: integer, minimum: 0 }
        total_sets: { type: integer, minimum: 0 }
        completed_sets: { type: integer, minimum: 0 }
        total_reps: { type: integer, minimum: 0, nullable: true }
        volume_load_kg: { type: number, minimum: 0, nullable: true, description: Soma de repetitions × load_kg somente em séries concluídas com ambos numéricos. }
        exercises_count: { type: integer, minimum: 0 }
        duration_s: { type: number, minimum: 0, nullable: true }
        distribution_by_exercise:
          type: array
          items: { $ref: '#/components/schemas/ProgressStrengthExerciseDistribution' }
        distribution_by_primary_muscle:
          type: array
          items: { $ref: '#/components/schemas/ProgressStrengthMuscleDistribution' }
        units: { $ref: '#/components/schemas/ProgressUnits' }
    ProgressStrengthResponse:
      type: object
      required: [data]
      properties:
        data: { $ref: '#/components/schemas/ProgressStrengthData' }
    ProgressExerciseSummary:
      type: object
      required: [exercise_id, name, sessions_count, sets_count, last_performed_at, best_load_kg, recent_load_kg, recent_volume_load_kg]
      properties:
        exercise_id: { type: string }
        name: { type: string }
        sessions_count: { type: integer, minimum: 0 }
        sets_count: { type: integer, minimum: 0 }
        last_performed_at: { type: string, format: date-time }
        best_load_kg: { type: number, minimum: 0, nullable: true, description: 'MAX(carga_kg) all-time em série concluída, mesma definição da Training Platform.' }
        recent_load_kg: { type: number, minimum: 0, nullable: true }
        recent_volume_load_kg: { type: number, minimum: 0, nullable: true }
    ProgressExerciseListData:
      type: object
      required: [range, data, meta]
      properties:
        range: { $ref: '#/components/schemas/ProgressRange' }
        data:
          type: array
          items: { $ref: '#/components/schemas/ProgressExerciseSummary' }
        meta:
          type: object
          required: [page, limit, has_more]
          properties:
            page: { type: integer, minimum: 1 }
            limit: { type: integer, minimum: 1, maximum: 100 }
            has_more: { type: boolean }
    ProgressExerciseListResponse:
      type: object
      required: [data]
      properties:
        data: { $ref: '#/components/schemas/ProgressExerciseListData' }
    ProgressExerciseSet:
      type: object
      required: [number, repetitions, load_kg, rir, rpe, completed]
      properties:
        number: { type: integer, minimum: 1 }
        repetitions: { type: integer, minimum: 0, nullable: true }
        load_kg: { type: number, minimum: 0, nullable: true }
        rir: { type: number, nullable: true }
        rpe: { type: number, nullable: true }
        completed: { type: boolean }
    ProgressExerciseSession:
      type: object
      required: [activity_id, date, title, sets_count, completed_sets, total_reps, best_load_kg, volume_load_kg, sets]
      properties:
        activity_id: { type: string }
        date: { type: string, format: date }
        title: { type: string, nullable: true }
        sets_count: { type: integer, minimum: 0 }
        completed_sets: { type: integer, minimum: 0 }
        total_reps: { type: integer, minimum: 0, nullable: true }
        best_load_kg: { type: number, minimum: 0, nullable: true }
        volume_load_kg: { type: number, minimum: 0, nullable: true }
        sets:
          type: array
          items: { $ref: '#/components/schemas/ProgressExerciseSet' }
    ProgressExerciseDetailData:
      type: object
      required: [range, exercise, sessions_count, sets_count, best_load_kg, recent_load_kg, recent_volume_load_kg, data, units]
      properties:
        range: { $ref: '#/components/schemas/ProgressRange' }
        exercise:
          type: object
          required: [id, name]
          properties:
            id: { type: string }
            name: { type: string }
        sessions_count: { type: integer, minimum: 0 }
        sets_count: { type: integer, minimum: 0 }
        best_load_kg: { type: number, minimum: 0, nullable: true }
        recent_load_kg: { type: number, minimum: 0, nullable: true }
        recent_volume_load_kg: { type: number, minimum: 0, nullable: true }
        data:
          type: array
          items: { $ref: '#/components/schemas/ProgressExerciseSession' }
        units: { $ref: '#/components/schemas/ProgressUnits' }
    ProgressExerciseDetailResponse:
      type: object
      required: [data]
      properties:
        data: { $ref: '#/components/schemas/ProgressExerciseDetailData' }
    ProgressPlannedActualDuration:
      type: object
      required: [planned_duration_s, actual_duration_s, comparable_completed_count]
      properties:
        planned_duration_s: { type: number, minimum: 0, nullable: true }
        actual_duration_s: { type: number, minimum: 0, nullable: true }
        comparable_completed_count: { type: integer, minimum: 0 }
    ProgressPlannedActualDistance:
      type: object
      required: [planned_distance_m, actual_distance_m, comparable_completed_count]
      properties:
        planned_distance_m: { type: number, minimum: 0, nullable: true }
        actual_distance_m: { type: number, minimum: 0, nullable: true }
        comparable_completed_count: { type: integer, minimum: 0 }
      description: Só é comparada para modalidades route-capable com distância planejada e executada disponíveis.
    ProgressAdherenceData:
      type: object
      required: [total_count, planned_count, completed_count, cancelled_count, pending_count, past_due_count, due_count, completion_rate, planned_vs_executed]
      properties:
