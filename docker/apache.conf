<Directory /var/www/html/public>
    AllowOverride All
    Require all granted
</Directory>
<Directory /var/www/html/public/uploads>
    AllowOverride None
    RewriteEngine Off
    Options -Indexes -ExecCGI -Includes -FollowSymLinks
    RemoveHandler .php .phtml .phar .cgi .pl .py .sh
    <FilesMatch "(?i)\.(php[0-9]*|phtml|phar|cgi|pl|py|sh|shtml)(\.|$)">
        Require all denied
    </FilesMatch>
    <FilesMatch "^\.">
        Require all denied
    </FilesMatch>
    <FilesMatch "(?i)\.(jpe?g|png|webp|gif)$">
        SetHandler default-handler
    </FilesMatch>
</Directory>
<FilesMatch "^\.">
    Require all denied
</FilesMatch>
